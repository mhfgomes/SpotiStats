name: Mobile release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
  EXPO_PUBLIC_AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release configuration
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL" || { echo "Missing repository variable EXPO_PUBLIC_CONVEX_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_AUTH_URL" || { echo "Missing repository variable EXPO_PUBLIC_AUTH_URL"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Android app
        run: pnpm package:android

      - name: Stage Android artifact
        run: cp apps/mobile/dist/SpotiStats-android.apk "SpotiStats-${RELEASE_TAG}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: SpotiStats-${{ env.RELEASE_TAG }}-android.apk
          if-no-files-found: error

  ios-unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: Validate release configuration
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL" || { echo "Missing repository variable EXPO_PUBLIC_CONVEX_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_AUTH_URL" || { echo "Missing repository variable EXPO_PUBLIC_AUTH_URL"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned iOS IPA
        run: pnpm package:ios:ipa

      - name: Stage unsigned iOS artifact
        run: cp apps/mobile/dist/SpotiStats-ios-unsigned.ipa "SpotiStats-${RELEASE_TAG}-ios-unsigned.ipa"

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-release
          path: SpotiStats-${{ env.RELEASE_TAG }}-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [android, ios-unsigned]
    runs-on: ubuntu-latest
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
