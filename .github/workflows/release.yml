name: Mobile release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
  EXPO_PUBLIC_AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BUILD_REF: ${{ inputs.tag || github.ref }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Default-branch builds seed the cache shared with release tags.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate release configuration
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL" || { echo "Missing repository variable EXPO_PUBLIC_CONVEX_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_AUTH_URL" || { echo "Missing repository variable EXPO_PUBLIC_AUTH_URL"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Android app
        run: pnpm package:android

      - name: Stage Android artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cp apps/mobile/dist/SpotiStats-android.apk "SpotiStats-${RELEASE_TAG}-android.apk"

      - name: Upload Android artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: SpotiStats-${{ env.RELEASE_TAG }}-android.apk
          if-no-files-found: error
          retention-days: 7

  ios-unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: Set up compiler cache
        run: |
          command -v ccache || brew install ccache
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Restore iOS compiler cache
        id: ios-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.xcode }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ios-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.xcode }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ios-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.xcode }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Validate release configuration
        run: |
          test -n "$EXPO_PUBLIC_CONVEX_URL" || { echo "Missing repository variable EXPO_PUBLIC_CONVEX_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_AUTH_URL" || { echo "Missing repository variable EXPO_PUBLIC_AUTH_URL"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned iOS IPA
        run: pnpm package:ios:ipa

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save iOS compiler cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.ios-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ios-ccache.outputs.cache-primary-key }}

      - name: Stage unsigned iOS artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cp apps/mobile/dist/SpotiStats-ios-unsigned.ipa "SpotiStats-${RELEASE_TAG}-ios-unsigned.ipa"

      - name: Upload unsigned iOS artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-release
          path: SpotiStats-${{ env.RELEASE_TAG }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [android, ios-unsigned]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
